<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bù dữ liệu chấm công</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --ok: #22c55e;
    --err: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 4px;
  }
  p.sub {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin: 16px 0 6px;
  }
  input {
    width: 100%;
    background: #0f172a;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .row {
    display: flex;
    gap: 12px;
  }
  .row > div {
    flex: 1;
    min-width: 0;
  }
  button {
    width: 100%;
    margin-top: 24px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .result {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    display: none;
  }
  .result.show { display: block; }
  .result.ok {
    background: rgba(34, 197, 94, 0.12);
    border: 1px solid rgba(34, 197, 94, 0.35);
    color: #86efac;
  }
  .result.err {
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid rgba(239, 68, 68, 0.35);
    color: #fca5a5;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Bù dữ liệu chấm công (Backfill ATTLOG)</h1>
    <p class="sub">
      Yêu cầu máy chấm công gửi lại dữ liệu quẹt thẻ cũ trong một khoảng thời gian.
      Lệnh sẽ được gửi xuống máy vào lần <code>getrequest</code> kế tiếp (thường trong vài chục giây).
    </p>

    <label for="sn">Số serial máy chấm công (SN)</label>
    <input id="sn" type="text" placeholder="vd: 2017173760763" value="2017173760763" />

    <div class="row">
      <div>
        <label for="start">Từ ngày</label>
        <input id="start" type="datetime-local" step="1" />
      </div>
      <div>
        <label for="end">Đến ngày</label>
        <input id="end" type="datetime-local" step="1" />
      </div>
    </div>

    <button id="submitBtn" type="button">Gửi yêu cầu bù dữ liệu</button>

    <div id="result" class="result"></div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);

  // Mac dinh: tu dau ngay hom nay den hien tai, cho tien click nhanh
  (function setDefaults() {
    const now = new Date();
    const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
    $('start').value = toLocalInputValue(startOfDay);
    $('end').value = toLocalInputValue(now);
  })();

  function toLocalInputValue(date) {
    const pad = (n) => String(n).padStart(2, '0');
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
  }

  // input datetime-local tra ve "YYYY-MM-DDTHH:mm:ss" (hoac khong co giay neu step khong duoc ho tro)
  // -> doi thanh "YYYY-MM-DD HH:mm:ss" nhu server yeu cau
  function toServerFormat(inputValue) {
    if (!inputValue) return '';
    let v = inputValue.replace('T', ' ');
    if (v.length === 16) v += ':00'; // thieu giay
    return v;
  }

  function showResult(text, isOk) {
    const el = $('result');
    el.textContent = text;
    el.className = 'result show ' + (isOk ? 'ok' : 'err');
  }

  $('submitBtn').addEventListener('click', async () => {
    const sn = $('sn').value.trim();
    const start = toServerFormat($('start').value);
    const end = toServerFormat($('end').value);

    if (!sn || !start || !end) {
      showResult('Vui lòng nhập đủ SN, từ ngày và đến ngày.', false);
      return;
    }

    const btn = $('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Đang gửi...';

    try {
      const url = `/admin/backfill?SN=${encodeURIComponent(sn)}&start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`;
      const res = await fetch(url, { method: 'POST' });
      const text = await res.text();
      showResult(text, res.ok);
    } catch (err) {
      showResult('Không gọi được server: ' + err.message, false);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Gửi yêu cầu bù dữ liệu';
    }
  });
</script>
</body>
</html>
